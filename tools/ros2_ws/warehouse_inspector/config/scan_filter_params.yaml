# ============================================================================
# scan_filter 的参数 —— 单一事实来源
#
# 为什么单独放一个文件，而不是写在 launch 的参数字典里（这是一个真实故障）：
#   launch_ros 对「Python 字符串」参数会用 yaml.dump() 序列化后再传给节点
#   （launch_ros/utilities/normalize_parameters.py:151-152）。
#   PyYAML 的隐式解析器要求无穷写成带前导点的 `.inf`，因此它不认为裸 `inf`
#   是数字，dump('inf') 输出的就是**不带引号**的 inf；接收端 rcl 按 YAML 1.1
#   解析，裸 `inf` 正是 **DOUBLE 无穷**。于是节点按 STRING 声明该参数时抛
#   InvalidParameterTypeException，在 __init__ 里直接崩溃。
#   （对比：dump('460800') 会加引号 —— 数字样式的字符串反而安全，所以只有
#    invalid_value 这一项出问题。）
#   写成独立文件即可显式加引号，类型不再漂移；另外 launch 的 dict 里放数组
#   会被 dump 成 `!!python/tuple`（PyYAML 专用标签），放文件里是正常的序列。
#
# ⚠ 本文件在 install/ 下也有一份副本，改动需要重新编译才生效：
#     cd ~/ros2_ws && colcon build --packages-select warehouse_inspector
# ============================================================================
scan_filter:
  ros__parameters:
    scan_in: /scan_raw
    scan_out: /scan

    # 距离下限：挡掉车体自身结构（雷达装在车体最前方，扫描面离底盘上表面 3cm）。
    # 实车若发现正前方 20~30cm 的小障碍不被识别，降到 0.20；
    # 若地图里仍有落在车体足迹内的幽灵像素，往上加。
    min_range: 0.28
    max_range: 12.0

    # 屏蔽扇区（原始 laser 坐标系，单位「度」，两两成对）。
    # 2026-10-22 改为空：实测车尾方向（原 0°±45°）能正常读到 1.79m 的墙，
    # 并没有"整段被自身结构遮挡"。原来那条 [-45, 10] 是在 scan_filter 空转
    # （输入 /scan_raw 无人发布）的状态下调的，属于过度屏蔽——它把车尾 55°
    # 的真实视野整块挖成 inf，后退时会看不见后方。
    # 自回波已由下面的 min_range 0.28 处理（雷达装于车体顶面，车体回波 < 0.28m）。
    # 若将来在点云里看到落在车体足迹内的幽灵点，再按需加小扇区（如 [-8, 8]）。
    # 注意：ROS2 无法从空列表推断参数类型，所以"不屏蔽"要写成一对命不中的角
    # （下面 99..99 在归一化到 (-180,180] 后永不成立），不能写 []。
    mask_sectors: [99.0, 99.0]

    # 整帧旋转（度）。
    #
    # ⚠ 这里必须是 0：本车的 180° 补偿**已经由 launch 里的静态 TF 完成**。
    #   inspection.launch.py 的 base_link -> laser 用的 yaw = 3.14159，
    #   正是为了抵消"雷达编码器 0° 指向车尾"（物理事实，三条实测：
    #   ① 走 18.4cm 后 0° 读数变远 18.7cm；② 180°=4.2m 长通道 vs 0°=1.79m；
    #   ③ 人站车头正前 1m 时回波出现在 180°）。
    #
    #   两条路都能把方向掰正，但**不能同时做**：
    #     路 A（本包原设计）：offset=0  + TF yaw=π     <- 当前采用
    #     路 B：             offset=180 + TF yaw=0
    #   两者叠加 = 转 360° = 抵消，方向反而全反（2026-10-22 一度踩到这个坑）。
    #
    #   判据只有一个：车直线前进 20cm，/odom_laser 的 x 增量必须为**正**。
    #   若为负，说明当前走的是路 B 的配置，把 TF 的 yaw 改成 0 即可。
    angle_offset_deg: 0.0

    # 被过滤掉的光束写什么值。**必须写成带引号的字符串**，否则会被 YAML
    # 解析成浮点（裸 inf/nan）而与声明类型冲突。
    # 可用：'inf'（默认，ROS 惯例）/ 'nan' / 'max'（= max_range）/ 任意数值。
    invalid_value: 'inf'

    # >0 时周期性打印各方位最小回波，用于自校准（0 = 关闭）。
    report_period: 0.0
